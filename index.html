<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.webmanifest">
<title>Elvaret | Baza klientów</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="brand">ELVARET<span>DETAILING</span></div><button id="addBtn">+ Klient</button></header>
<main>
<section class="stats"><div><b id="clientsCount">0</b><small>Klienci</small></div><div><b id="visitsCount">0</b><small>Wizyty</small></div><div><b id="revenue">0 zł</b><small>Przychód</small></div></section>
<input id="search" class="search" placeholder="🔎 Szukaj klienta, telefonu, auta lub rejestracji">
<div id="clients"></div>
</main>
<div id="modal" class="modal hidden"><div class="sheet"><h2>Nowy klient</h2>
<input id="name" placeholder="Imię i nazwisko"><input id="phone" placeholder="Telefon" type="tel"><input id="city" placeholder="Miejscowość">
<input id="car" placeholder="Samochód"><input id="reg" placeholder="Rejestracja"><input id="service" placeholder="Usługa">
<input id="price" placeholder="Cena (zł)" type="number" inputmode="decimal"><input id="date" type="date">
<div class="row"><button class="ghost" id="cancel">Anuluj</button><button id="save">Zapisz klienta</button></div>
</div></div>
<script src="app.js"></script>
</body></html>
